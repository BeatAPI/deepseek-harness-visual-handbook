    <rect x="24" y="62" width="104" height="58" rx="14" fill="#122a42" stroke="#38d9ff" stroke-width="2"/>
    <text x="76" y="97" text-anchor="middle" fill="#eaf8ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Model</text>
