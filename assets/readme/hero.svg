      <rect x="291" y="101" width="72" height="34" rx="9" fill="#173953"/><text x="327" y="124" text-anchor="middle" fill="#83eaff">session</text>
      <rect x="204" y="148" width="72" height="34" rx="9" fill="#1b3b32"/><text x="240" y="171" text-anchor="middle" fill="#a7f292">loop</text>
      <rect x="291" y="148" width="72" height="34" rx="9" fill="#1b3b32"/><text x="327" y="171" text-anchor="middle" fill="#a7f292">policy</text>
