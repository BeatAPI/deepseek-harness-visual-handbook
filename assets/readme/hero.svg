    <text x="0" y="54" dominant-baseline="hanging" fill="#f4f8fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">DeepSeek Harness</text>
    <text x="0" y="126" dominant-baseline="hanging" fill="#38d9ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Visual Handbook</text>
    <text x="0" y="205" dominant-baseline="hanging" fill="#b9c8d6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">A 103-page guide to the runtime layer behind agents.</text>
    <text x="0" y="241" dominant-baseline="hanging" fill="#91a8bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PLUGINS · TOOLS · MEMORY · LOOPS · PERMISSIONS · PRODUCTION</text>
  </g>
  <g transform="translate(735 42)">
